<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=5" />
<link rel="manifest" href="./manifest.json?v=5" />
<meta name="theme-color" content="#0a0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DocShift" />
<title>DocShift — private document workbench</title>
<!--
  Privacy contract (see the README):
  - no external requests, ever. Every asset is same-origin.
  - no service worker, no localStorage/sessionStorage/IndexedDB/Cache API/cookies.
  - documents live in memory only and are destroyed when the tab closes.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'wasm-unsafe-eval';
  worker-src 'self' blob:;
  img-src 'self' data: blob:;
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  connect-src 'self';
  frame-src 'none';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
