<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sheetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheetB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <g transform="translate(256, 256) scale(1.25)">
    <!-- Back Sheet (Original format) -->
    <g transform="translate(-46, -42)">
      <rect x="-85" y="-115" width="170" height="230" rx="22" fill="url(#sheetA)" opacity="0.82"/>
      <polygon points="45,-115 85,-75 45,-75" fill="#60a5fa"/>
    </g>
    <!-- Front Sheet (Shifted target format) -->
    <g transform="translate(46, 42)">
      <rect x="-85" y="-115" width="170" height="230" rx="22" fill="url(#sheetB)" opacity="0.95" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
      <polygon points="45,-115 85,-75 45,-75" fill="#e0f2fe"/>
      <!-- Shift Chevrons: transformation indicator -->
      <path d="M -25,-12 L 0,0 L -25,12" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 5, -12 L 30,0 L 5,12" fill="none" stroke="#67e8f9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>